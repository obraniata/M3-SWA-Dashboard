<style>
    :root {
      --t-bg-deep:      #0C0A08;
      --t-bg-cave:      #14100C;
      --t-bg-panel:     #1C1712;
      --t-bg-card:      #2A231A;
      --t-bg-card-h:    #362D22;
      --t-border:       #4A3D2E;
      --t-border-glow:  #C4A35A;
      --t-gold:         #D4A84B;
      --t-gold-lt:      #F0C96E;
      --t-coral:        #C45C3A;
      --t-coral-br:     #E87A55;
      --t-sand:         #D8C9A8;
      --t-ash:          #9A8A72;
      --t-stone:        #6A5A48;
      --t-chalk:        #F5EDE0;
      --t-green:        #4CAF50;
      --t-green-lt:     #81C784;
      --t-amber:        #FF9800;
      --t-red:          #E53935;
      --t-red-lt:       #EF5350;
      --t-blue:         #6CB4F5;
      --f-display:      'Cinzel Decorative', serif;
      --f-head:         'Cinzel', serif;
      --f-body:         'Nunito', sans-serif;
      --f-fun:          'Fredoka One', cursive;
      --r:              10px;
      --rl:             14px;
      --sh:             0 4px 24px rgba(0,0,0,.5);
      --glow:           0 0 20px rgba(196,163,90,.25);
      --tr:             0.22s cubic-bezier(.4,0,.2,1);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; }
    body {
      font-family: var(--f-body);
      background: var(--t-bg-deep);
      color: var(--t-sand);
      min-height: 100vh;
      overflow-x: hidden;
    }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: var(--t-bg-cave); }
    ::-webkit-scrollbar-thumb { background: var(--t-border-glow); border-radius: 4px; }
    ::selection { background: var(--t-gold); color: var(--t-bg-deep); }

    /* ============ PIN GATE ============ */
    #pin-gate {
      position: fixed;
      inset: 0;
      z-index: 5000;
      background: radial-gradient(circle at 50% 20%, #1A140E 0%, var(--t-bg-deep) 70%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    #pin-gate.hidden { display: none; }
    .pin-box {
      width: 100%;
      max-width: 400px;
      background: var(--t-bg-panel);
      border: 1px solid var(--t-border);
      border-radius: var(--rl);
      box-shadow: var(--sh), var(--glow);
      padding: 34px 28px 28px;
      animation: pinIn .4s cubic-bezier(.4,0,.2,1);
    }
    @keyframes pinIn {
      from { opacity: 0; transform: translateY(14px) scale(.98); }
      to   { opacity: 1; transform: none; }
    }
    .pin-emoji { font-size: 2.6rem; text-align: center; margin-bottom: 10px; }
    .pin-title {
      font-family: var(--f-display);
      font-size: 1.5rem;
      color: var(--t-gold-lt);
      text-align: center;
      letter-spacing: .04em;
      margin-bottom: 6px;
      text-shadow: 0 0 24px rgba(212,168,75,.35);
    }
    .pin-sub {
      font-family: var(--f-body);
      font-size: .88rem;
      color: var(--t-ash);
      text-align: center;
      margin-bottom: 24px;
      line-height: 1.5;
    }
    .pin-field { margin-bottom: 16px; }
    .pin-input {
      width: 100%;
      background: var(--t-bg-card);
      border: 1px solid var(--t-border);
      color: var(--t-chalk);
      font-family: var(--f-body);
      font-size: 1.4rem;
      font-weight: 800;
      letter-spacing: .5em;
      text-align: center;
      padding: 14px 13px;
      border-radius: var(--r);
      transition: var(--tr);
    }
    .pin-input::placeholder { color: var(--t-stone); letter-spacing: .3em; }
    .pin-input:focus {
      outline: none;
      border-color: var(--t-gold);
      box-shadow: 0 0 0 3px rgba(212,168,75,.2);
    }
    .pin-input.err {
      border-color: var(--t-coral);
      box-shadow: 0 0 0 3px rgba(196,92,58,.2);
    }
    .pin-errmsg {
      font-family: var(--f-body);
      font-size: .78rem;
      font-weight: 700;
      color: var(--t-coral-br);
      margin-top: 6px;
      min-height: 0;
      display: none;
      text-align: center;
    }
    .pin-errmsg.show { display: block; }
    .pin-submit {
      width: 100%;
      background: linear-gradient(135deg, var(--t-coral), var(--t-coral-br));
      color: #fff;
      border: none;
      border-radius: var(--r);
      padding: 14px;
      font-family: var(--f-body);
      font-size: 1rem;
      font-weight: 800;
      letter-spacing: .02em;
      cursor: pointer;
      transition: var(--tr);
      box-shadow: 0 4px 16px rgba(196,92,58,.3);
    }
    .pin-submit:hover { filter: brightness(1.08); }
    .pin-submit:disabled { opacity: .6; cursor: wait; }
    .pin-note {
      font-family: var(--f-body);
      font-size: .72rem;
      color: var(--t-stone);
      text-align: center;
      margin-top: 14px;
      line-height: 1.5;
    }

    /* ============ DASHBOARD HEADER ============ */
    #db-header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: linear-gradient(90deg, var(--t-bg-cave), #1A140E 50%, var(--t-bg-cave));
      border-bottom: 1px solid var(--t-border);
      padding: 14px 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      box-shadow: 0 2px 20px rgba(0,0,0,.6);
      flex-wrap: wrap;
    }
    .db-header-left {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
      min-width: 260px;
    }
    .db-header-emoji { font-size: 1.8rem; }
    .db-header-title {
      font-family: var(--f-head);
      font-size: 1rem;
      font-weight: 700;
      color: var(--t-gold-lt);
      letter-spacing: .03em;
      line-height: 1.2;
    }
    .db-header-sub {
      font-family: var(--f-body);
      font-size: .72rem;
      color: var(--t-ash);
      font-weight: 600;
      letter-spacing: .02em;
    }
    .db-header-right {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }
    .db-header-link, .db-header-btn {
      font-family: var(--f-body);
      font-size: .8rem;
      font-weight: 800;
      padding: 8px 14px;
      border-radius: 20px;
      cursor: pointer;
      transition: var(--tr);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
    }
    .db-header-link {
      background: rgba(212,168,75,.12);
      border: 1px solid rgba(212,168,75,.3);
      color: var(--t-gold-lt);
    }
    .db-header-link:hover {
      background: var(--t-gold);
      color: var(--t-bg-deep);
      border-color: var(--t-gold);
    }
    .db-header-btn {
      background: rgba(196,92,58,.15);
      border: 1px solid rgba(196,92,58,.35);
      color: var(--t-coral-br);
    }
    .db-header-btn:hover {
      background: var(--t-coral);
      color: #fff;
    }

    /* ============ CONTROLS BAR ============ */
    #db-controls {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 16px 22px;
      background: var(--t-bg-cave);
      border-bottom: 1px solid var(--t-border);
      flex-wrap: wrap;
    }
    .db-control-group { display: flex; align-items: center; gap: 8px; }
    .db-control-label {
      font-family: var(--f-body);
      font-size: .72rem;
      font-weight: 800;
      color: var(--t-stone);
      text-transform: uppercase;
      letter-spacing: .08em;
    }
    .db-control-select {
      background: var(--t-bg-card);
      border: 1px solid var(--t-border);
      color: var(--t-sand);
      font-family: var(--f-body);
      font-size: .85rem;
      font-weight: 700;
      padding: 8px 14px;
      border-radius: var(--r);
      cursor: pointer;
      transition: var(--tr);
    }
    .db-control-select:focus { outline: none; border-color: var(--t-gold); }
    .db-refresh-btn {
      background: linear-gradient(135deg, var(--t-gold), var(--t-coral));
      color: var(--t-bg-deep);
      border: none;
      border-radius: var(--r);
      padding: 8px 16px;
      font-family: var(--f-body);
      font-size: .82rem;
      font-weight: 800;
      cursor: pointer;
      transition: var(--tr);
      box-shadow: 0 2px 10px rgba(196,92,58,.3);
    }
    .db-refresh-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 16px rgba(196,92,58,.5);
    }
    .db-refresh-btn:disabled { opacity: .6; cursor: wait; transform: none; }
    .db-last-updated {
      font-family: var(--f-body);
      font-size: .72rem;
      color: var(--t-stone);
      font-weight: 700;
    }

    /* ============ LOADING ============ */
    #db-loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 80px 20px;
      gap: 16px;
    }
    .db-loading-spinner {
      width: 48px;
      height: 48px;
      border: 4px solid var(--t-border);
      border-top-color: var(--t-gold);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .db-loading-text {
      font-family: var(--f-body);
      font-size: .9rem;
      font-weight: 700;
      color: var(--t-ash);
    }

    /* ============ CONTENT ============ */
    #db-content {
      max-width: 1400px;
      margin: 0 auto;
      padding: 24px 22px 80px;
    }

    /* ============ SNAPSHOT ============ */
    .snapshot-section { margin-bottom: 28px; }
    .snapshot-title {
      font-family: var(--f-head);
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--t-gold-lt);
      letter-spacing: .04em;
      margin-bottom: 14px;
    }
    .snapshot-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 14px;
      margin-bottom: 14px;
    }
    .snapshot-card {
      background: var(--t-bg-card);
      border: 1px solid var(--t-border);
      border-radius: var(--rl);
      padding: 20px;
      text-align: center;
      transition: var(--tr);
    }
    .snapshot-card:hover {
      border-color: var(--t-border-glow);
      box-shadow: var(--glow);
      transform: translateY(-2px);
    }
    .snapshot-card-num {
      font-family: var(--f-fun);
      font-size: 2.6rem;
      line-height: 1;
      margin-bottom: 8px;
    }
    .snapshot-card-lbl {
      font-family: var(--f-body);
      font-size: .78rem;
      font-weight: 800;
      color: var(--t-ash);
      text-transform: uppercase;
      letter-spacing: .08em;
    }
    .snapshot-priority {
      background: linear-gradient(135deg, rgba(229,57,53,.12), rgba(196,92,58,.08));
      border: 1px solid rgba(229,57,53,.35);
      border-radius: var(--rl);
      padding: 16px 20px;
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
    }
    .snapshot-priority-icon { font-size: 1.6rem; }
    .snapshot-priority-text {
      font-family: var(--f-body);
      font-size: .9rem;
      font-weight: 600;
      color: var(--t-sand);
      line-height: 1.5;
      flex: 1;
      min-width: 200px;
    }
    .snapshot-priority-text strong {
      color: var(--t-coral-br);
      font-weight: 800;
    }

    /* ============ VIEW TABS ============ */
    .view-tabs-section { margin-bottom: 20px; }
    .view-tabs {
      display: flex;
      gap: 8px;
      background: var(--t-bg-cave);
      padding: 6px;
      border-radius: var(--rl);
      border: 1px solid var(--t-border);
      width: fit-content;
    }
    .view-tab {
      background: transparent;
      border: none;
      color: var(--t-ash);
      font-family: var(--f-body);
      font-size: .88rem;
      font-weight: 800;
      padding: 10px 22px;
      border-radius: var(--r);
      cursor: pointer;
      transition: var(--tr);
      white-space: nowrap;
    }
    .view-tab:hover {
      color: var(--t-sand);
      background: rgba(212,168,75,.06);
    }
    .view-tab.active {
      background: linear-gradient(135deg, var(--t-gold), var(--t-coral));
      color: var(--t-bg-deep);
      box-shadow: 0 2px 10px rgba(196,92,58,.35);
    }

    /* ============ SECTION CARDS ============ */
    .section-list { display: flex; flex-direction: column; gap: 16px; }
    .section-card {
      background: var(--t-bg-panel);
      border: 1px solid var(--t-border);
      border-radius: var(--rl);
      overflow: hidden;
      transition: var(--tr);
    }
    .section-card:hover {
      border-color: var(--t-border-glow);
      box-shadow: var(--glow);
    }
    .section-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 16px 20px;
      background: linear-gradient(135deg, var(--t-bg-cave), var(--t-bg-card));
      border-bottom: 1px solid var(--t-border);
      cursor: pointer;
      user-select: none;
      flex-wrap: wrap;
    }
    .section-card-title {
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: var(--f-head);
      font-size: 1rem;
      font-weight: 700;
      color: var(--t-gold-lt);
      letter-spacing: .02em;
    }
    .section-card-title-emoji { font-size: 1.3rem; }
    .section-card-meta {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .section-card-pill {
      font-family: var(--f-body);
      font-size: .72rem;
      font-weight: 800;
      padding: 5px 12px;
      border-radius: 20px;
      background: var(--t-bg-card);
      border: 1px solid var(--t-border);
      color: var(--t-sand);
      white-space: nowrap;
    }
    .section-card-pill strong { color: var(--t-gold-lt); font-weight: 900; }
    .section-card-pill.strong {
      border-color: rgba(76,175,80,.4);
      color: var(--t-green-lt);
      background: rgba(76,175,80,.1);
    }
    .section-card-pill.review {
      border-color: rgba(255,152,0,.4);
      color: #FFB74D;
      background: rgba(255,152,0,.1);
    }
    .section-card-pill.reteach {
      border-color: rgba(229,57,53,.5);
      color: var(--t-red-lt);
      background: rgba(229,57,53,.12);
    }
    .section-card-arrow {
      font-size: .8rem;
      color: var(--t-stone);
      transition: transform .25s ease;
    }
    .section-card.collapsed .section-card-arrow { transform: rotate(-90deg); }
    .section-card-body {
      max-height: 6000px;
      overflow: hidden;
      transition: max-height .4s cubic-bezier(.4,0,.2,1), opacity .3s;
      opacity: 1;
    }
    .section-card.collapsed .section-card-body {
      max-height: 0;
      opacity: 0;
    }

    /* ============ TABLE ============ */
    .table-wrap { overflow-x: auto; padding: 4px; }
    table.qtable {
      width: 100%;
      border-collapse: collapse;
      font-family: var(--f-body);
      font-size: .82rem;
    }
    table.qtable thead th {
      background: var(--t-bg-cave);
      color: var(--t-stone);
      font-size: .68rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .08em;
      padding: 12px 14px;
      text-align: left;
      border-bottom: 1px solid var(--t-border);
      position: sticky;
      top: 0;
      z-index: 2;
    }
    table.qtable tbody td {
      padding: 12px 14px;
      border-bottom: 1px solid var(--t-border);
      color: var(--t-sand);
      vertical-align: middle;
      font-weight: 600;
    }
    table.qtable tbody tr:hover { background: rgba(212,168,75,.05); }
    table.qtable tbody tr:last-child td { border-bottom: none; }
    .q-num {
      font-family: var(--f-fun);
      font-size: 1rem;
      color: var(--t-gold-lt);
      font-weight: 900;
      white-space: nowrap;
    }
    .q-text { max-width: 360px; line-height: 1.4; }
    .q-type-badge {
      font-size: .65rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .05em;
      padding: 3px 8px;
      border-radius: 10px;
      background: rgba(212,168,75,.12);
      color: var(--t-gold-lt);
      border: 1px solid rgba(212,168,75,.3);
      white-space: nowrap;
    }
    .q-count {
      font-family: var(--f-fun);
      font-size: 1.1rem;
      font-weight: 900;
      text-align: center;
      white-space: nowrap;
    }
    .q-count.correct { color: var(--t-green-lt); }
    .q-count.wrong { color: var(--t-red-lt); }
    .q-count.total { color: var(--t-ash); }
    .q-pct-cell { min-width: 140px; }
    .q-pct-bar-wrap { display: flex; align-items: center; gap: 10px; }
    .q-pct-bar {
      flex: 1;
      height: 8px;
      background: var(--t-bg-cave);
      border-radius: 4px;
      overflow: hidden;
      min-width: 70px;
    }
    .q-pct-fill {
      height: 100%;
      border-radius: 4px;
      transition: width .5s ease;
    }
    .q-pct-fill.strong { background: linear-gradient(90deg, #4CAF50, #81C784); }
    .q-pct-fill.review { background: linear-gradient(90deg, #FF9800, #FFB74D); }
    .q-pct-fill.reteach { background: linear-gradient(90deg, #E53935, #EF5350); }
    .q-pct-num {
      font-family: var(--f-fun);
      font-size: .95rem;
      font-weight: 900;
      min-width: 44px;
      text-align: right;
    }
    .q-pct-num.strong { color: var(--t-green-lt); }
    .q-pct-num.review { color: #FFB74D; }
    .q-pct-num.reteach { color: var(--t-red-lt); }
    .q-status-badge {
      font-size: .68rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .06em;
      padding: 5px 12px;
      border-radius: 20px;
      white-space: nowrap;
      display: inline-block;
    }
    .q-status-badge.strong {
      background: rgba(76,175,80,.12);
      color: var(--t-green-lt);
      border: 1px solid rgba(76,175,80,.35);
    }
    .q-status-badge.review {
      background: rgba(255,152,0,.12);
      color: #FFB74D;
      border: 1px solid rgba(255,152,0,.35);
    }
    .q-status-badge.reteach {
      background: rgba(229,57,53,.15);
      color: var(--t-red-lt);
      border: 1px solid rgba(229,57,53,.45);
    }
    .warning-badge {
      font-size: .65rem;
      font-weight: 800;
      background: rgba(255,152,0,.15);
      color: #FFB74D;
      border: 1px solid rgba(255,152,0,.4);
      padding: 3px 8px;
      border-radius: 10px;
      margin-left: 8px;
      white-space: nowrap;
      display: inline-block;
    }
    .btn-action-pill {
      background: rgba(212,168,75,.12);
      border: 1px solid rgba(212,168,75,.35);
      color: var(--t-gold-lt);
      font-family: var(--f-body);
      font-size: .72rem;
      font-weight: 800;
      padding: 6px 12px;
      border-radius: 20px;
      cursor: pointer;
      transition: var(--tr);
      white-space: nowrap;
      margin-bottom: 4px;
    }
    .btn-action-pill:hover {
      background: var(--t-gold);
      color: var(--t-bg-deep);
      border-color: var(--t-gold);
    }
    .btn-reteach {
      background: rgba(76,175,80,.12);
      border-color: rgba(76,175,80,.35);
      color: var(--t-green-lt);
    }
    .btn-reteach:hover {
      background: var(--t-green);
      color: #fff;
      border-color: var(--t-green);
    }
    .reteach-status-row {
      margin-top: 4px;
    }

    /* ============ RETeach STATUS BADGES ============ */
    .reteach-status-badge {
      display: inline-block;
      font-family: var(--f-body);
      font-size: .65rem;
      font-weight: 800;
      letter-spacing: .04em;
      text-transform: uppercase;
      padding: 3px 9px;
      border-radius: 20px;
      white-space: nowrap;
      border: 1px solid;
    }
    .reteach-status-badge.needs-reteach {
      background: rgba(229,57,53,.15);
      color: var(--t-red-lt);
      border-color: rgba(229,57,53,.5);
    }
    .reteach-status-badge.scheduled {
      background: rgba(255,152,0,.15);
      color: #FFB74D;
      border-color: rgba(255,152,0,.45);
    }
    .reteach-status-badge.in-progress {
      background: rgba(232,122,85,.15);
      color: var(--t-coral-br);
      border-color: rgba(232,122,85,.5);
    }
    .reteach-status-badge.done {
      background: rgba(76,175,80,.15);
      color: var(--t-green-lt);
      border-color: rgba(76,175,80,.5);
    }
    .reteach-status-badge.verified {
      background: rgba(108,180,245,.15);
      color: var(--t-blue);
      border-color: rgba(108,180,245,.5);
    }

    /* ============ HARDEST NOTE ============ */
    .hardest-note {
      padding: 14px 20px;
      background: rgba(229,57,53,.06);
      border-top: 1px solid var(--t-border);
      font-family: var(--f-body);
      font-size: .85rem;
